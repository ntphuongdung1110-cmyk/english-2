<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fb8c00">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lộ trình học">
<title>Lộ trình Nghe & Nói — 1 giờ mỗi ngày</title>
<style>
  :root{
    --v:#7e57c2; --v2:#5e35b1; --o:#fb8c00; --o2:#ef6c00;
    --ink:#1f2933; --muted:#6b7280; --line:#e5e7eb; --ok:#22c55e; --card:#fff; --bg:#f5f6f8;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--bg);line-height:1.55}
  header{padding:20px 18px;color:#fff;background:linear-gradient(135deg,#fb8c00,#7e57c2)}
  header h1{margin:0 0 4px;font-size:19px}
  header .sub{font-size:13px;opacity:.94}
  .wrap{max-width:720px;margin:0 auto;padding:14px 14px 70px}
  a.home{color:#fff;text-decoration:none;font-size:13px;opacity:.9}

  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:12px 0}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;border-radius:999px;padding:5px 11px}
  .chip.day{background:#eef2ff;color:#3730a3}
  .chip.streak{background:#fff7ed;color:#c2410c;border:1px solid #fed7aa}
  .chip.prog{background:#ecfdf5;color:#047857}
  .progbar{height:8px;background:#eef2f6;border-radius:999px;overflow:hidden;margin-top:4px}
  .progbar>i{display:block;height:100%;background:linear-gradient(90deg,#fb8c00,#7e57c2)}

  .pickrow{display:flex;gap:8px;align-items:center;margin:12px 0 4px}
  .pickrow .navb{border:1px solid var(--line);background:#fff;border-radius:9px;width:38px;height:38px;font-size:18px;cursor:pointer;flex:0 0 auto}
  .ddwrap{position:relative;flex:1;min-width:0}
  .ddbtn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px;cursor:pointer;color:var(--ink);font-weight:700}
  .ddbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ddlist{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:60;background:#fff;
    border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.18);max-height:320px;overflow:auto;padding:4px}
  .ddlist[hidden]{display:none}
  .dditem{padding:9px 11px;border-radius:7px;cursor:pointer;font-size:14px}
  .dditem:hover{background:#f1f5f9}
  .dditem.sel{background:#eef2ff;color:#1e40af;font-weight:700}

  .days{display:flex;gap:8px;margin:10px 0 14px}
  .dtab{flex:1;text-align:center;padding:10px 6px;border-radius:12px;cursor:pointer;font-weight:700;font-size:13px;
    border:1px solid var(--line);background:#fff;color:var(--muted)}
  .dtab small{display:block;font-weight:600;font-size:11px;opacity:.8;margin-top:2px}
  .dtab.active{color:#fff;border-color:transparent}
  .dtab.d1.active{background:linear-gradient(135deg,#fb8c00,#ef6c00)}
  .dtab.d2.active{background:linear-gradient(135deg,#3b82f6,#2563eb)}
  .dtab.d3.active{background:linear-gradient(135deg,#7e57c2,#5e35b1)}
  .dtab.done{border-color:var(--ok);color:var(--ok)}

  .intro{font-size:13px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}

  .step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .step.done{border-color:var(--ok);background:#f0fdf4}
  .step-head{display:flex;align-items:flex-start;gap:10px}
  .chk{width:26px;height:26px;flex:0 0 26px;border-radius:8px;border:2px solid #cbd5e1;display:flex;
    align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:#fff;background:#fff;margin-top:1px}
  .step.done .chk{background:var(--ok);border-color:var(--ok)}
  .step-title{font-weight:700;font-size:15px}
  .step-time{font-size:12px;color:var(--muted);font-weight:600}
  .step-body{margin:10px 0 0 36px;font-size:14px}

  .spk{border:none;background:#eef2ff;color:#3730a3;border-radius:8px;padding:2px 8px;font-size:13px;cursor:pointer;margin-left:4px}
  .vlist{list-style:none;margin:6px 0 0;padding:0}
  .vlist li{padding:8px 0;border-bottom:1px dashed var(--line)}
  .vlist .w{font-weight:700}
  .vlist .ipa{color:#8b5cf6;font-size:12px;margin-left:4px}
  .vlist .m{color:var(--muted)}
  .vlist .ex{display:block;color:#0f5132;background:#f0fdf4;border-radius:8px;padding:5px 9px;margin-top:5px;font-size:13px}
  ta,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:14px;font-family:inherit;resize:vertical;min-height:70px}
  .qa{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin:8px 0;background:#fafafa}
  .qa .q{font-weight:700;cursor:pointer}
  .qa .a{display:none;margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);color:#0f5132}
  .qa .a.show{display:block}
  .turn{padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
  .turn b{color:var(--v2)}
  .turn .vi{color:var(--muted);font-size:12.5px;display:block}
  .videoBox{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000;margin:8px 0}
  .videoBox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .shadow{background:#f0f9ff;border:1px solid #bae6fd;border-radius:12px;padding:11px 13px;margin-top:8px}
  .shadow .en{font-size:15px;line-height:1.75}
  .shadow .vi{color:#6b7280;font-size:13px;margin-top:6px}
  a.btn{display:inline-block;text-decoration:none;background:#111827;color:#fff;padding:8px 12px;border-radius:9px;font-size:13px;font-weight:600;margin:6px 6px 0 0}
  a.btn.o{background:var(--o)} a.btn.v{background:var(--v)}
  .done-cta{position:sticky;bottom:10px;margin-top:16px}
  .done-cta button{width:100%;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,#fb8c00,#7e57c2);cursor:pointer;box-shadow:0 8px 24px rgba(126,87,194,.35)}
  .toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#111827;color:#fff;
    padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;z-index:80;text-align:center;max-width:90%}
  .toast.show{opacity:1}
  .note{font-size:12px;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
<header>
  <a class="home" href="index.html">← Trang chủ</a>
  <h1>🐢 Lộ trình Nghe &amp; Nói — 1 giờ mỗi ngày</h1>
  <div class="sub">Đi chậm mà chắc. Mỗi chủ đề học trong 3 ngày: <b>Từ vựng → Nghe → Nói</b>. Nghỉ vài hôm cũng không sao — cứ quay lại là được. 💛</div>
</header>

<div class="wrap">
  <div class="bar">
    <span class="chip day" id="chDay">Buổi 1</span>
    <span class="chip streak" id="chStreak">🔥 0 ngày</span>
    <span class="chip prog" id="chProg">Chủ đề 1/46</span>
    <div style="flex-basis:100%"><div class="progbar"><i id="progFill" style="width:0%"></i></div></div>
  </div>

  <div class="pickrow">
    <button class="navb" id="prevT" title="Chủ đề trước">‹</button>
    <div class="ddwrap">
      <button class="ddbtn" id="ddbtn"><span id="ddlabel">—</span><span>▾</span></button>
      <div class="ddlist" id="ddlist" hidden></div>
    </div>
    <button class="navb" id="nextT" title="Chủ đề sau">›</button>
  </div>

  <div class="days">
    <div class="dtab d1" data-day="1">Ngày 1<small>📚 Từ vựng</small></div>
    <div class="dtab d2" data-day="2">Ngày 2<small>🎧 Nghe</small></div>
    <div class="dtab d3" data-day="3">Ngày 3<small>🗣️ Nói</small></div>
  </div>

  <div class="intro" id="intro"></div>
  <div id="steps"></div>

  <div class="done-cta"><button id="doneBtn">✅ Mình đã học xong hôm nay</button></div>
</div>

<div class="toast" id="toast"></div>

<script src="ontap-kiemtra-data.js"></script>
<script>
/* ================= Lộ trình học chậm — 1h/ngày =================
   Mỗi chủ đề (từ window.ONTAP) học trong 3 ngày:
   Ngày 1: Từ vựng + tự đặt câu · Ngày 2: Nghe (video BBC + shadowing)
   Ngày 3: Nói (trả lời câu hỏi + hội thoại + nói 1 phút).
   Tiến độ, câu tự viết và streak lưu ở localStorage.               */
/* Video theo chủ đề — mỗi ID đã được kiểm tra là video thật, còn sống (YouTube oEmbed).
   THEME: {id, t(tên thật), q(từ khoá tìm thêm)} · TOPIC_THEME: chỉ số chủ đề → theme. */
const THEME = {
  intro:{id:"tqTJAXfzD0E",t:"Introducing Yourself and Meeting New People",q:"introduce yourself meet people english conversation"},
  family:{id:"cxXDlLcXmdo",t:"How to Talk About Your Family in English",q:"talking about your family english conversation"},
  love:{id:"WdWDvqk8Yo8",t:"English Expressions to Talk About Love & Relationships",q:"talking about love relationships english conversation"},
  fashion:{id:"5SAf8lj4HtM",t:"How to Talk About Clothes in English",q:"talking about clothes fashion english conversation"},
  directions:{id:"F97z4DBiaAY",t:"Asking for and Giving Directions — English Conversation",q:"asking for and giving directions english conversation"},
  daily:{id:"E8MM91zhsvI",t:"Talking About Your Habits & Daily Routines in English",q:"daily routine habits english conversation"},
  restaurant:{id:"ki2m6Sr3UAU",t:"Ordering at a Restaurant — Everyday English Dialogues",q:"ordering food restaurant english conversation"},
  hobbies:{id:"8NGVXvgl-d8",t:"Talking About Hobbies in English",q:"talking about hobbies english conversation"},
  expressions:{id:"OIv9mONRhmU",t:"33 Useful English Phrases for Daily Conversations",q:"common english phrases daily conversation"},
  travel:{id:"YeDz983icpw",t:"How to Talk About Holidays and Travel in English",q:"talking about travel holidays english conversation"},
  past:{id:"rZS5qlCGCIY",t:"How to Talk About the Past in English",q:"talking about past experiences english conversation"},
  sz:{id:"JAKIw40sVlw",t:"How to Pronounce /s/ and /z/ in English",q:"s and z sounds pronunciation english"},
  th:{id:"x6Pdp8GBwTM",t:"How do I pronounce 'th' sounds? — BBC Learning English",q:"th sound pronunciation english this think"},
  conditional:{id:"aCM633yN5V4",t:"The 2nd Conditional: WOULD & COULD — English Grammar",q:"second conditional would english grammar"},
  describe:{id:"WZL0LM3c79k",t:"English Vocabulary to Describe Everyday Objects",q:"describing objects english vocabulary"},
  careers:{id:"D-ukmakW6Vs",t:"Talking About Your Job — English Conversation about Work",q:"talking about your job career english conversation"},
  supermarket:{id:"xA32p3CEt8Y",t:"At the Supermarket — Daily English Conversation",q:"at the supermarket english conversation"},
  personality:{id:"KK7fUiniP88",t:"Adjectives to Describe Personality and Character",q:"describing personality character adjectives english"},
  opinions:{id:"qtmf_k5q9us",t:"Asking for & Giving Opinions — Agreeing & Disagreeing",q:"giving opinions agreeing disagreeing english"},
  verbs:{id:"P-jqai6YtJY",t:"Expressions with Take, Make, Do, and Have",q:"get take make do common english verbs"},
  tenses:{id:"A7KdpeeDEBA",t:"Verb Tenses — Past, Present, Future (English Grammar)",q:"english verb tenses past present future"},
  irregular:{id:"lIkaqLavbU0",t:"The 50 Most Common Irregular Verbs in English",q:"irregular verbs english pronunciation list"},
  feelings:{id:"udWXxCOGgs8",t:"How to Talk About Emotions in English",q:"talking about feelings emotions english conversation"},
  senses:{id:"i4deGOh578c",t:"Five Senses in English — Sight, Smell, Hearing, Taste, Touch",q:"five senses english vocabulary"},
  health:{id:"Qn9QKZrNbeo",t:"At the Doctor — How to Describe Your Symptoms in English",q:"at the doctor health english conversation symptoms"},
  driving:{id:"WNfCpZIAFPg",t:"Talking about Traffic in English",q:"driving traffic english conversation vocabulary"},
  money:{id:"6N6C4P_Wsgo",t:"How to Talk About Money in English (earn/save/spend)",q:"talking about money spending saving english conversation"},
  general:{id:"TL61VKkme14",t:"Talking about meetings — Real Easy English (BBC)",q:"english conversation lesson subtitles"}
};
const TOPIC_THEME = {0:"intro",1:"family",2:"love",3:"fashion",4:"fashion",5:"directions",6:"daily",7:"restaurant",8:"hobbies",9:"daily",10:"daily",11:"expressions",12:"travel",13:"past",14:"past",15:"past",16:"sz",17:"intro",18:"expressions",19:"hobbies",20:"th",21:"conditional",22:"daily",23:"intro",24:"fashion",25:"describe",26:"careers",27:"supermarket",28:"personality",29:"directions",30:"intro",31:"intro",32:"opinions",33:"conditional",34:"verbs",35:"tenses",36:"irregular",37:"irregular",38:"irregular",39:"feelings",40:"senses",41:"love",42:"health",43:"personality",44:"driving",45:"money"};
function videoFor(i){ return THEME[TOPIC_THEME[i]] || THEME.general; }
const LS = "study_program_v3";
const $ = id => document.getElementById(id);
const T = (window.ONTAP || []).filter(t => t && t.name);
const NT = T.length;

/* ---------- state ---------- */
function load(){ try{ return JSON.parse(localStorage.getItem(LS)) || {}; }catch(e){ return {}; } }
function save(s){ localStorage.setItem(LS, JSON.stringify(s)); }
let st = load();
if(!st.done) st.done = {};        // {"t-d": true}
if(!st.dates) st.dates = [];      // ["2026-8-24", ...] ngày có học
if(!st.notes) st.notes = {};      // {"t-d-k": "câu tự viết"}
if(st.t == null){ st.t = firstUndone().t; st.d = firstUndone().d; }
if(st.d == null) st.d = 1;

function firstUndone(){
  for(let t=0;t<NT;t++) for(let d=1;d<=3;d++) if(!st.done[t+"-"+d]) return {t,d};
  return {t:NT-1,d:3};
}
function todayStr(){ const x=new Date(); return x.getFullYear()+"-"+(x.getMonth()+1)+"-"+x.getDate(); }
function doneCount(){ return Object.keys(st.done).filter(k=>st.done[k]).length; }

/* streak: số ngày liên tiếp có học, tính đến hôm nay hoặc hôm qua (không phạt nếu nghỉ) */
function streak(){
  const set = new Set(st.dates);
  const d = new Date(); let n=0;
  // cho phép mốc bắt đầu là hôm nay hoặc hôm qua
  const key = x => x.getFullYear()+"-"+(x.getMonth()+1)+"-"+x.getDate();
  if(!set.has(key(d))){ d.setDate(d.getDate()-1); if(!set.has(key(d))) return 0; }
  while(set.has(key(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}

/* ---------- helpers nội dung ---------- */
// Lấy tối đa 8 mục "từ vựng" cho chủ đề: ưu tiên vocab, nếu không có thì lấy từ extra.rows
function wordsOf(t){
  const out=[];
  (t.vocab||[]).forEach(v=> out.push({w:v.e, ip:v.ip||"", m:v.v||v.d||"", ex:v.x||""}));
  if(out.length < 6 && Array.isArray(t.extra)){
    t.extra.forEach(b=> (b.rows||[]).forEach(r=>{ if(out.length<10) out.push({w:r.e, ip:"", m:r.v||"", ex:r.a||""}); }));
  }
  return out.slice(0,8);
}
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function speak(txt){ if(!txt||!window.speechSynthesis) return; speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt); u.lang="en-US"; u.rate=.9; speechSynthesis.speak(u); }
const shortName = t => t.name.split(" / ")[0].trim();

/* ---------- dropdown chủ đề ---------- */
function buildDD(){
  const list=$("ddlist");
  list.innerHTML = T.map((t,i)=>{
    const c = [0,1,2].every(d=>st.done[i+"-"+(d+1)]) ? " ✓" : "";
    return '<div class="dditem'+(i===st.t?' sel':'')+'" data-i="'+i+'">'+esc(t.icon)+' '+esc(shortName(t))+c+'</div>';
  }).join("");
  list.querySelectorAll(".dditem").forEach(el=>el.onclick=()=>{ st.t=+el.dataset.i; st.d=1; list.hidden=true; render(); });
}
$("ddbtn").onclick = ()=>{ const l=$("ddlist"); l.hidden=!l.hidden; };
document.addEventListener("click", e=>{ if(!e.target.closest(".ddwrap")) $("ddlist").hidden=true; });
$("prevT").onclick=()=>{ st.t=(st.t-1+NT)%NT; st.d=1; render(); };
$("nextT").onclick=()=>{ st.t=(st.t+1)%NT; st.d=1; render(); };
document.querySelectorAll(".dtab").forEach(el=>el.onclick=()=>{ st.d=+el.dataset.day; render(); });

/* ---------- render các bước theo ngày ---------- */
function stepWrap(title, time, key, bodyHTML){
  const done = !!st.done["step-"+st.t+"-"+st.d+"-"+key];
  return '<div class="step'+(done?' done':'')+'" data-step="'+key+'">'+
    '<div class="step-head"><div class="chk" data-chk="'+key+'">'+(done?'✓':'')+'</div>'+
    '<div style="flex:1"><div class="step-title">'+title+'</div><div class="step-time">'+time+'</div></div></div>'+
    '<div class="step-body">'+bodyHTML+'</div></div>';
}

function noteBox(k, ph){
  const val = esc(st.notes[st.t+"-"+st.d+"-"+k]||"");
  return '<textarea data-note="'+k+'" placeholder="'+ph+'">'+val+'</textarea>';
}

function day1(t){                       // 📚 TỪ VỰNG + ĐẶT CÂU
  const ws = wordsOf(t);
  const vHTML = '<ul class="vlist">'+ws.map(o=>
    '<li><span class="w">'+esc(o.w)+'</span>'+(o.ip?'<span class="ipa">'+esc(o.ip)+'</span>':'')+
    '<button class="spk" onclick="speak(\''+esc(o.w).replace(/'/g,"\\'")+'\')">🔊</button>'+
    ' — <span class="m">'+esc(o.m)+'</span>'+(o.ex?'<span class="ex">“'+esc(o.ex)+'”</span>':'')+'</li>').join('')+'</ul>';
  return stepWrap("① Học 8 từ vựng của chủ đề","≈ 25 phút · nghe 🔊 và đọc theo, chép nghĩa ra giấy","voc",
      '<div class="note">Đọc to từng từ 3 lần. Bấm 🔊 để nghe phát âm chuẩn.</div>'+vHTML)
  + stepWrap("② Tự đặt 5 câu với từ mới","≈ 25 phút · dùng câu ví dụ làm mẫu","make",
      '<div class="note">Chọn 5 từ bạn thích, tự viết 5 câu của <b>chính bạn</b> (về công việc, gia đình, hôm nay…). Viết sai cũng không sao!</div>'+
      noteBox("make","1. \n2. \n3. \n4. \n5. "))
  + stepWrap("③ Đọc to 5 câu vừa viết","≈ 10 phút · thu âm lại càng tốt","read",
      '<div class="note">Đọc to 5 câu của bạn 2 lần. Nghe lại xem có tự nhiên không.</div>')
  + linkFull(t);
}

function day2(t){                       // 🎧 NGHE
  const sh = t.shadow && t.shadow.en ? t.shadow : null;
  const V = videoFor(st.t);
  const searchUrl = "https://www.youtube.com/results?search_query="+encodeURIComponent(V.q || (shortName(t)+" english conversation lesson"));
  return stepWrap("① Ôn nhanh 8 từ hôm qua","≈ 10 phút","rev",
      '<div class="note">Nhìn nghĩa tiếng Việt, tự nói lại từ tiếng Anh. Mở lại <a href="on-tap-kiem-tra.html">bài từ vựng</a> nếu quên.</div>')
  + stepWrap("② Nghe video của chủ đề (nghe 3 lần)","≈ 30 phút · 🎬 "+esc(V.t),"vid",
      '<div class="note">Video hợp với chủ đề <b>'+esc(shortName(t))+'</b>. Lần 1: nghe thư giãn, không cần hiểu hết. Lần 2: bật phụ đề (CC), nghe kỹ. Lần 3: <b>nói nhại theo</b> (shadowing) từng câu.</div>'+
      '<div class="videoBox"><iframe src="https://www.youtube-nocookie.com/embed/'+V.id+'" title="'+esc(V.t)+'" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen loading="lazy"></iframe></div>'+
      '<div style="margin-top:6px"><a class="btn" href="'+searchUrl+'" target="_blank" rel="noopener">▶︎ Mở thêm video chủ đề này trên YouTube</a></div>'+
      (sh? '<div class="note" style="margin-top:10px">Rồi nghe & nói nhại đoạn của chủ đề này (bấm 🔊):</div>'+
        '<div class="shadow"><button class="spk" onclick="speak(this.parentNode.querySelector(\'.en\').textContent)">🔊 Nghe cả đoạn</button>'+
        '<p class="en">'+esc(sh.en)+'</p><p class="vi">'+esc(sh.vi)+'</p></div>' : ''))
  + stepWrap("③ Chép lại 5 câu bạn nghe được","≈ 20 phút · luyện tai","dict",
      '<div class="note">Nghe lại video/đoạn văn, chép ra 5 câu hoặc cụm bạn nghe rõ. Không cần đúng 100%.</div>'+
      noteBox("dict","1. \n2. \n3. \n4. \n5. "))
  + linkFull(t);
}

function day3(t){                       // 🗣️ NÓI
  const qa = (t.qa||[]).slice(0,6);
  const qaHTML = qa.length ? '<div class="note">Đọc câu hỏi, <b>tự trả lời to</b> trước, rồi bấm để xem câu mẫu.</div>'+
      qa.map(x=>'<div class="qa"><div class="q" onclick="this.nextElementSibling.classList.toggle(\'show\')">'+esc(x.q)+' 👀</div><div class="a">'+esc(x.a)+'<button class="spk" onclick="speak(this.parentNode.textContent)">🔊</button></div></div>').join('')
      : '<div class="note">Chủ đề này chưa có câu hỏi — hãy tự nói về nó 1 phút.</div>';
  const cv = (t.convo||[]);
  const cvHTML = cv.length ? '<div class="note">Đọc to CẢ HAI vai A và B (bấm 🔊 để nghe mẫu). Rồi đóng 1 vai, tự nói vai kia.</div>'+
      cv.map(x=>'<div class="turn"><b>'+esc(x.p)+':</b> '+esc(x.e)+'<button class="spk" onclick="speak(\''+esc(x.e).replace(/'/g,"\\'")+'\')">🔊</button><span class="vi">'+esc(x.v||"")+'</span></div>').join('')
      : '';
  return stepWrap("① Trả lời câu hỏi — nói to","≈ 30 phút · nói trước, xem đáp án sau","ans", qaHTML)
  + (cv.length? stepWrap("② Đóng vai hội thoại","≈ 20 phút","role", cvHTML) : '')
  + stepWrap("③ Nói 1 phút về chủ đề","≈ 10 phút · thu âm lại","min",
      '<div class="note">Tự nói liên tục 1 phút về chủ đề "'+esc(shortName(t))+'". Dùng đoạn shadowing hôm qua làm dàn ý. Không dừng lại sửa — cứ nói!</div>')
  + linkFull(t);
}
function linkFull(t){
  return '<div style="margin-top:4px"><a class="btn o" href="on-tap-kiem-tra.html">📖 Mở đầy đủ chủ đề này</a>'+
    '<a class="btn v" href="on-tap.html">🗂️ Sổ từ vựng</a></div>';
}

/* ---------- render tổng ---------- */
function render(){
  st.t=Math.max(0,Math.min(NT-1,st.t)); st.d=Math.max(1,Math.min(3,st.d));
  const t=T[st.t];
  $("ddlabel").textContent = esc(t.icon)+" "+shortName(t);
  buildDD();
  // day tabs
  document.querySelectorAll(".dtab").forEach(el=>{
    const d=+el.dataset.day;
    el.classList.toggle("active", d===st.d);
    el.classList.toggle("done", !!st.done[st.t+"-"+d]);
  });
  const introTxt = {
    1:"📚 <b>Ngày Từ vựng.</b> Hôm nay chỉ cần nhớ vài từ và tự đặt câu. Chậm thôi, chất lượng hơn số lượng.",
    2:"🎧 <b>Ngày Nghe.</b> Hôm nay tai làm việc: nghe video và nói nhại theo. Nghe không hiểu hết cũng bình thường.",
    3:"🗣️ <b>Ngày Nói.</b> Hôm nay miệng làm việc: trả lời to, đóng vai, và nói 1 phút. Sai cũng cứ nói!"
  }[st.d];
  $("intro").innerHTML = introTxt;
  $("steps").innerHTML = (st.d===1?day1(t):st.d===2?day2(t):day3(t));
  bindSteps();
  // top bar
  $("chDay").textContent = "Buổi "+(doneCount()+1);
  const sk=streak(); $("chStreak").textContent = "🔥 "+sk+" ngày";
  $("chProg").textContent = "Chủ đề "+(st.t+1)+"/"+NT;
  $("progFill").style.width = Math.round(doneCount()/(NT*3)*100)+"%";
  const allDone = [1,2,3].every(d=>st.done[st.t+"-"+d]);
  $("doneBtn").textContent = allDone ? "➡️ Sang chủ đề tiếp theo" : "✅ Mình đã học xong hôm nay";
  save(st);
  window.scrollTo({top:0,behavior:"smooth"});
}

function bindSteps(){
  document.querySelectorAll("[data-chk]").forEach(el=>el.onclick=()=>{
    const k="step-"+st.t+"-"+st.d+"-"+el.dataset.chk;
    st.done[k]=!st.done[k]; save(st);
    el.parentNode.parentNode.classList.toggle("done",st.done[k]);
    el.textContent = st.done[k] ? "✓" : "";
  });
  document.querySelectorAll("[data-note]").forEach(el=>el.oninput=()=>{
    st.notes[st.t+"-"+st.d+"-"+el.dataset.note]=el.value; save(st);
  });
}

function toast(msg){ const t=$("toast"); t.innerHTML=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2600); }

$("doneBtn").onclick=()=>{
  const allDone=[1,2,3].every(d=>st.done[st.t+"-"+d]);
  if(allDone){ st.t=Math.min(NT-1,st.t+1); st.d=1; render(); return; }
  st.done[st.t+"-"+st.d]=true;
  const ds=todayStr(); if(!st.dates.includes(ds)) st.dates.push(ds);
  const msgs=["Tuyệt vời! Mỗi ngày một chút, bạn đang tiến bộ 🌱","Làm tốt lắm! Hẹn gặp lại ngày mai 💪",
    "Xong buổi hôm nay rồi! Nghỉ ngơi nhé 😊","Kiên trì chính là bí quyết. Giỏi quá! ⭐"];
  toast(msgs[doneCount()%msgs.length]);
  // sang ngày kế tiếp trong cùng chủ đề, hoặc chủ đề mới
  if(st.d<3) st.d++; else { st.t=Math.min(NT-1,st.t+1); st.d=1; }
  setTimeout(render,700);
};

render();
</script>
</body>
